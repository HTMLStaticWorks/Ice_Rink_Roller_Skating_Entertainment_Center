<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GlowGlide</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
        }
    </style>
</head>
<body>

    <div class="auth-card custom-card bg-black border-secondary shadow-lg">
        <div class="text-center mb-5">
            <a href="index.html"><img src="assets/images/logo.svg" alt="Logo" height="50"></a>
            <h2 class="mt-4">Welcome Back</h2>
            <p class="opacity-50">Sign in to manage your bookings.</p>
        </div>

        <form>
            <div class="mb-4">
                <label class="form-label small opacity-75">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-white border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-dark border-secondary text-white border-start-0 p-3" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small opacity-75">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-white border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-dark border-secondary text-white border-start-0 p-3" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe">
                    <label class="form-check-label small opacity-75" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="small text-primary">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary w-100 p-3 mb-4">Sign In</button>

            <div class="text-center">
                <p class="small opacity-50 mb-0">Don't have an account? <a href="register.html" class="text-primary fw-bold">Sign Up</a></p>
            </div>
        </form>

        <div class="mt-5 pt-4 border-top border-secondary text-center">
            <a href="index.html" class="small opacity-50"><i class="bi bi-arrow-left me-2"></i> Back to Home</a>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
