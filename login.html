<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GlowGlide</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-card {
            max-width: 450px;
            padding: 2.25rem;
        }
    </style>
</head>

<body class="auth-page">

    <div class="floating-controls">
        <button id="theme-toggle" class="btn-icon" title="Toggle Theme"><i class="bi bi-moon-stars"></i></button>
        <button id="rtl-toggle" class="btn-icon" title="Toggle RTL">RTL</button>
    </div>

    <div class="auth-card custom-card shadow-lg">
        <div class="text-center mb-4">
            <a href="index.html"><img src="assets/images/logo.svg" alt="Logo" height="40"></a>
            <h2 class="mt-3">Welcome Back</h2>
            <p class="auth-subtext">Sign in to manage your bookings.</p>
        </div>

        <form>
            <div class="mb-4">
                <label class="form-label small opacity-75">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i
                            class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 p-3"
                        placeholder="name@example.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small">Password</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 p-3"
                        placeholder="••••••••" required id="password">
                    <button class="input-group-text password-toggle" type="button">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-center align-items-center gap-3 gap-sm-4 mb-4">
                <div class="form-check d-flex align-items-center mb-0 p-0">
                    <input class="form-check-input position-static m-0 me-2" type="checkbox" id="rememberMe">
                    <label class="form-check-label small mb-0 text-nowrap" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="small text-primary text-nowrap">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary w-100 p-3 mb-4">Sign In</button>

            <div class="auth-divider">
                <span>Or continue with</span>
            </div>

            <div class="social-auth-buttons">
                <button type="button" class="btn-social">
                    <i class="bi bi-google"></i>
                    Google
                </button>
                <button type="button" class="btn-social">
                    <i class="bi bi-apple"></i>
                    Apple
                </button>
            </div>

            <div class="text-center">
                <p class="small auth-subtext mb-0">Don't have an account? <a href="register.html"
                        class="text-primary fw-bold">Sign Up</a></p>
            </div>
        </form>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
