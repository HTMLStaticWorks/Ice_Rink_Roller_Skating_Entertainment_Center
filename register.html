<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GlowGlide</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 3rem;
        }
    </style>
</head>
<body>

    <div class="auth-card custom-card bg-black border-secondary shadow-lg">
        <div class="text-center mb-5">
            <a href="index.html"><img src="assets/images/logo.svg" alt="Logo" height="50"></a>
            <h2 class="mt-4">Join the Glide</h2>
            <p class="opacity-50">Create an account for faster bookings.</p>
        </div>

        <form>
            <div class="row g-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label small opacity-75">First Name</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white p-3" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label small opacity-75">Last Name</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white p-3" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small opacity-75">Email Address</label>
                <input type="email" class="form-control bg-dark border-secondary text-white p-3" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small opacity-75">Password</label>
                <input type="password" class="form-control bg-dark border-secondary text-white p-3" placeholder="••••••••" required>
            </div>
            <div class="mb-4">
                <label class="form-label small opacity-75">Confirm Password</label>
                <input type="password" class="form-control bg-dark border-secondary text-white p-3" placeholder="••••••••" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input bg-dark border-secondary" type="checkbox" id="terms" required>
                <label class="form-check-label small opacity-75" for="terms">I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn-primary w-100 p-3 mb-4">Create Account</button>

            <div class="text-center">
                <p class="small opacity-50 mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold">Sign In</a></p>
            </div>
        </form>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
