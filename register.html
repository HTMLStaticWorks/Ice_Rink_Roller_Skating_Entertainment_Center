<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GlowGlide</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-card {
            max-width: 500px;
            padding: 2.25rem;
        }
    </style>
</head>
<body class="auth-page">

    <div class="floating-controls">
        <button id="theme-toggle" class="btn-icon" title="Toggle Theme"><i class="bi bi-moon-stars"></i></button>
        <button id="rtl-toggle" class="btn-icon" title="Toggle RTL">RTL</button>
    </div>

    <div class="auth-card custom-card shadow-lg">
        <div class="text-center mb-4">
            <a href="index.html"><img src="assets/images/logo.svg" alt="Logo" height="40"></a>
            <h2 class="mt-3">Join the Glide</h2>
            <p class="auth-subtext">Create an account for faster bookings.</p>
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label small">First Name</label>
                <input type="text" class="form-control p-3" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Last Name</label>
                <input type="text" class="form-control p-3" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Email Address</label>
                <input type="email" class="form-control p-3" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Password</label>
                <input type="password" class="form-control p-3" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Confirm Password</label>
                <input type="password" class="form-control p-3" placeholder="••••••••" required>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-primary">Terms</a> & <a href="#" class="text-primary">Privacy</a></label>
            </div>

            <button type="submit" class="btn-primary w-100 p-3 mb-4">Create Account</button>

            <div class="auth-divider">
                <span>Or sign up with</span>
            </div>

            <div class="social-auth-buttons">
                <button type="button" class="btn-social">
                    <i class="bi bi-google"></i>
                    Google
                </button>
                <button type="button" class="btn-social">
                    <i class="bi bi-apple"></i>
                    Apple
                </button>
            </div>

            <div class="text-center">
                <p class="small auth-subtext mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold">Sign In</a></p>
            </div>
        </form>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
