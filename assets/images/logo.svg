<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background for visibility in all themes -->
  <rect width="200" height="60" rx="12" fill="#0a0a0a" />
  <!-- Icon: Skating Blade/Wheel Hybrid -->
  <path d="M10 45 Q 30 50 50 45 T 90 45" stroke="url(#glowGradient)" stroke-width="4" fill="none" />
  <circle cx="20" cy="45" r="5" fill="#00f2ff" />
  <circle cx="50" cy="45" r="5" fill="#7000ff" />
  <circle cx="80" cy="45" r="5" fill="#ff00ff" />
  <!-- Text -->
  <text x="10" y="30" font-family="Outfit, sans-serif" font-size="28" font-weight="800" fill="white">GLOW</text>
  <text x="95" y="30" font-family="Outfit, sans-serif" font-size="28" font-weight="300" fill="#00f2ff">GLIDE</text>
