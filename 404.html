<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost on Ice | GlowGlide</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #0a0a12;
        }
        .error-code {
            font-size: 150px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(180deg, var(--primary), transparent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="mb-4">Whoops! You've Slipped.</h1>
        <p class="opacity-50 fs-5 mb-5 mx-auto" style="max-width: 500px;">Looks like you've wandered off the rink. The page you're looking for doesn't exist or has been moved.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="index.html" class="btn-primary">Back to Home</a>
            <a href="contact.html" class="btn-outline">Report Issue</a>
        </div>
        
        <div class="mt-5 pt-5">
            <img src="assets/images/logo.svg" alt="Logo" height="30" class="opacity-25">
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
